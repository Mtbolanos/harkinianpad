name: HarkinianPad iOS build

# Required, ROM-free proof for the sole project repository. Upstream source
# trees are pinned build inputs; this workflow never publishes to them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOYMENT_TARGET: "15.0"

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test source verification boundaries
        run: python3 -m unittest discover -s tests -p '*_test.py'

      - name: Check tracked assets, history, scripts, patches, and docs
        run: scripts/check-repo-safety.sh

  ios-build:
    name: Full app (unsigned iPhoneOS)
    runs-on: macos-15
    timeout-minutes: 120
    needs: repository-safety

    steps:
      - uses: actions/checkout@v7

      - name: Select the newest installed Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install build tools and native test dependencies
        run: >-
          brew install cmake pkgconf libzip

      - name: Cache host and iOS dependencies
        uses: actions/cache@v6
        with:
          path: |
            build-ios-soh/_deps
          key: harkinianpad-ios-${{ runner.os }}-${{ hashFiles('sources.lock.json', 'patches/**', 'scripts/**') }}

      - name: Run controller lifecycle regression
        run: scripts/test-controller-reconnect.sh

      - name: Test maintained dependency preservation
        run: python3 -m unittest discover -s tests -p '*_test.py'

      - name: Reproduce unsigned arm64 iPhoneOS app
        run: |
          set -o pipefail
          scripts/build-ios.sh --device 2>&1 | tee -a build.log

      # Build logs are not always downloadable; surface compiler and CMake errors as annotations.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|CMake Error|fatal error|Undefined symbol|ld: " build.log | sort -u | head -120 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          split -l 12 errors.txt chunk.
          for f in chunk.*; do
            msg="$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Build errors ($f)::$msg"
          done

      - name: Test pack import and selection boundaries
        run: scripts/test-mod-packs.sh

      - name: Audit unsigned package and signing gate
        run: |
          scripts/package-ios.sh
          if REQUIRE_SIGNED=1 scripts/package-ios.sh; then
            echo "Unsigned CI app unexpectedly passed REQUIRE_SIGNED=1" >&2
            exit 1
          fi

      # Personal test build for the fork owner: a ROM-free unsigned IPA kept as a
      # workflow artifact for 30 days, not a release.
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HarkinianPad-unsigned-ipa
          path: artifacts/*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
